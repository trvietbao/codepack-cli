name: Bug Report
description: Create a report to help us improve codepack-cli
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps or CLI command to reproduce the behavior.
      placeholder: |
        1. Run `codepack . --format xml`
        2. Inspect output
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating System, Python version, and codepack version.
      placeholder: Windows 11, Python 3.11, codepack 0.1.0
    validations:
      required: true
